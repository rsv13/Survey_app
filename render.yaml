# Render Blueprint — provisions the whole demo (database + API + web) in one go.
# In Render: New → Blueprint → connect this repo. After the first deploy, set the
# two URL env vars marked "sync: false" (see the deploy guide), then redeploy.

databases:
  - name: swswbs-db
    plan: free
    databaseName: swswbs
    user: swswbs

services:
  # ---- GraphQL backend (Node) ----
  - type: web
    runtime: node
    name: swswbs-api
    plan: free
    # --include=dev so build tools (tsx, prisma, typescript) install even though
    # Render sets NODE_ENV=production. Then generate the client, apply migrations,
    # and seed the baseline data (idempotent).
    buildCommand: npm install --include=dev && npm run db:generate -w server && npm run db:migrate:deploy -w server && npm run db:seed -w server && npm run db:sample -w server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: swswbs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The first admin account created by the seed (used to log in for the demo).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Your frontend URL, e.g. https://swswbs-web.onrender.com (set after 1st deploy).
      - key: WEB_URL
        sync: false
      # ---- Email (Resend over SMTP) ----
      # Points the mailer at Resend. SMTP_PASS is your Resend API key: it is a
      # secret, so it's entered in the Render dashboard (sync: false) and never
      # committed. The others aren't secret, so they live here for clarity.
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      # Demo sender. Resend's test address only delivers to your own Resend
      # account email. Swap to "SWSWBS <no-reply@yourdomain>" once you verify a
      # domain in Resend — no code change, just change this value.
      - key: EMAIL_FROM
        value: "SWSWBS <onboarding@resend.dev>"

  # ---- React frontend (static site) ----
  - type: web
    runtime: static
    name: swswbs-web
    buildCommand: npm install --include=dev && npm run build -w web
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your API URL, e.g. https://swswbs-api.onrender.com/ (set before build).
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback so client-side routes (e.g. /profile) work on refresh/deep-link.
      - type: rewrite
        source: /*
        destination: /index.html
