services:
  db:
    image: postgres:16
    container_name: swswbs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: swswbs
      POSTGRES_PASSWORD: swswbs_dev_password
      POSTGRES_DB: swswbs
    ports:
      - "5432:5432"
    volumes:
      - swswbs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swswbs -d swswbs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  swswbs_pgdata: